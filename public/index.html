<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xev - Demo</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #e0e0e0; line-height: 1.6; }
  .container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 28px; font-weight: 700; color: #fff; }
  h1 span { color: #e551ba; }
  .subtitle { color: #888; font-size: 14px; margin-top: 4px; }

  .section { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 20px; margin-top: 20px; }
  .section-title { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #e551ba; margin-bottom: 12px; }

  label { display: block; font-size: 13px; color: #aaa; margin-bottom: 4px; }
  input, textarea, select {
    width: 100%; background: #111; border: 1px solid #444; border-radius: 6px;
    color: #e0e0e0; padding: 8px 12px; font-size: 14px; font-family: inherit;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #e551ba; }
  textarea { resize: vertical; min-height: 80px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  .field { margin-bottom: 12px; }

  .question-card {
    background: #111; border: 1px solid #333; border-radius: 6px; padding: 16px;
    margin-bottom: 12px; position: relative;
  }
  .question-card .remove-btn {
    position: absolute; top: 8px; right: 8px; background: none; border: none;
    color: #666; cursor: pointer; font-size: 18px; line-height: 1;
  }
  .question-card .remove-btn:hover { color: #e551ba; }
  .question-header { display: flex; gap: 12px; margin-bottom: 12px; align-items: end; }
  .question-header .field { margin-bottom: 0; }
  .question-header input { width: 200px; }
  .question-header select { width: 140px; flex: none; }

  .criteria-row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
  .criteria-row input { flex: 1; }
  .remove-crit { background: none; border: none; color: #666; cursor: pointer; font-size: 16px; line-height: 1; padding: 0 4px; }
  .remove-crit:hover { color: #e551ba; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
    border-radius: 6px; border: 1px solid #444; background: #222; color: #e0e0e0;
    font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .btn:hover { border-color: #e551ba; color: #fff; }
  .btn-primary { background: #e551ba; border-color: #e551ba; color: #fff; font-weight: 600; }
  .btn-primary:hover { background: #d040a0; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .btn-danger { border-color: #c0392b; color: #e74c3c; }
  .btn-danger:hover { background: #c0392b; color: #fff; }

  .actions { display: flex; gap: 12px; margin-top: 20px; align-items: center; }

  .response-box {
    background: #111; border: 1px solid #333; border-radius: 6px; padding: 16px;
    font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px;
    white-space: pre-wrap; word-break: break-word; max-height: 500px; overflow-y: auto;
    min-height: 60px;
  }
  .response-box.error { border-color: #c0392b; color: #e74c3c; }
  .response-box.success { border-color: #27ae60; }
  .response-box.warning { border-color: #b8860b; color: #f5c542; }

  .status { font-size: 13px; color: #888; }
  .status.ok { color: #27ae60; }
  .status.err { color: #e74c3c; }
  .status.warn { color: #f5c542; }

  .preset-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
  .preset-label { font-size: 12px; color: #666; }
  .preset-input { width: 160px; flex: none; padding: 4px 8px; font-size: 12px; }
  .preset-chip { display: inline-flex; align-items: center; }
  .preset-chip .remove-crit { font-size: 15px; }
  .preset-chip .remove-crit:hover { color: #e74c3c; }
  .preset-msg { font-size: 12px; }

  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #555; border-top-color: #e551ba; border-radius: 50%; animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; background: #333; color: #aaa; }
  .tag-choice { background: #1a3a5c; color: #5dade2; }
  .tag-score { background: #3a1a3a; color: #e551ba; }
  .tag-noul { background: #1a3a1a; color: #27ae60; }

  .endpoint { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .endpoint code { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; color: #5dade2; word-break: break-all; }
  .method { background: #e551ba; color: #fff; font-weight: 700; font-size: 11px; padding: 3px 8px; border-radius: 4px; letter-spacing: 0.05em; }
  .tab-bar { display: flex; gap: 6px; margin-bottom: 8px; }
  .tab { padding: 4px 12px; font-size: 12px; border-radius: 4px; border: 1px solid #333; background: #111; color: #888; cursor: pointer; font-family: inherit; }
  .tab:hover { color: #fff; }
  .tab.active { border-color: #e551ba; color: #fff; background: #1a1a1a; }
  .copied { border-color: #27ae60 !important; color: #27ae60 !important; }
</style>
</head>
<body>
<div class="container">
  <h1><span>Xev</span> Demo</h1>
  <div class="subtitle">Structured LLM evaluation &mdash; TypeSafe-compatible API</div>

  <!-- Config -->
  <div class="section">
    <div class="section-title">Configuration</div>
    <div class="row">
      <div class="field">
        <label>LLM Base URL</label>
        <input id="cfg-url" placeholder="http://127.0.0.1:1234/v1" />
      </div>
      <div class="field">
        <label>Model</label>
        <input id="cfg-model" list="model-list" placeholder="qwen/qwen3.5-9b" />
        <datalist id="model-list"></datalist>
      </div>
      <div class="field">
        <label>API Key <span style="color:#555">(optional for local)</span></label>
        <input id="cfg-key" type="password" placeholder="not needed for LM Studio" />
      </div>
    </div>
    <div class="preset-bar" style="margin-bottom:0">
      <span class="preset-label">Connect to:</span>
      <button class="btn btn-sm" onclick="applyConnection('local')">Local (LM Studio)</button>
      <button class="btn btn-sm" onclick="applyConnection('openrouter')">OpenRouter</button>
      <button class="btn btn-sm" onclick="applyConnection('openai')">OpenAI</button>
      <button class="btn btn-sm" onclick="loadModels()">Load models</button>
      <span class="preset-msg" id="models-msg"></span>
    </div>
  </div>

  <!-- State -->
  <div class="section">
    <div class="section-title">State <span style="text-transform:none;letter-spacing:0;color:#666;font-weight:400">(content to evaluate)</span></div>
    <div class="field">
      <textarea id="state" rows="4" placeholder="Paste text, chat log, or JSON here..."></textarea>
    </div>
    <div class="preset-bar">
      <span class="preset-label">Presets:</span>
      <button class="btn btn-sm" onclick="loadPreset('support')">Support Ticket</button>
      <button class="btn btn-sm" onclick="loadPreset('code')">Code Review</button>
      <button class="btn btn-sm" onclick="loadPreset('email')">Email Triage</button>
    </div>
    <div class="preset-bar">
      <span class="preset-label">Saved:</span>
      <span id="saved-presets" style="display:contents"></span>
      <input id="preset-name" class="preset-input" placeholder="Preset name" onkeydown="if(event.key==='Enter')savePreset()" />
      <button class="btn btn-sm btn-primary" onclick="savePreset()">Save</button>
      <span class="preset-msg" id="preset-msg"></span>
    </div>
  </div>

  <!-- Questions -->
  <div class="section">
    <div class="section-title">Questions</div>
    <div id="questions"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-sm" onclick="addQuestion('choice')">+ Choice</button>
      <button class="btn btn-sm" onclick="addQuestion('score')">+ Score</button>
      <button class="btn btn-sm" onclick="addQuestion('noul')">+ Noul</button>
    </div>
  </div>

  <!-- API Request -->
  <div class="section">
    <div class="section-title">API Request <span style="text-transform:none;letter-spacing:0;color:#666;font-weight:400">(the same endpoint third-party apps call)</span></div>
    <div class="endpoint">
      <span class="method">POST</span>
      <code id="req-url"></code>
      <div style="flex:1"></div>
      <button class="btn btn-sm" id="copy-btn" onclick="copyRequest()">Copy Body</button>
    </div>
    <div class="tab-bar">
      <button class="tab active" id="tab-body" onclick="setReqTab('body')">Body</button>
      <button class="tab" id="tab-headers" onclick="setReqTab('headers')">Headers</button>
      <button class="tab" id="tab-curl" onclick="setReqTab('curl')">cURL</button>
    </div>
    <div class="response-box" id="preview" style="max-height:320px"></div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn btn-primary" id="send-btn" onclick="sendRequest()">
      <span id="send-label">Send Evaluation</span>
    </button>
    <span class="status" id="status"></span>
    <div style="flex:1"></div>
    <button class="btn btn-sm btn-danger" onclick="clearAll()">Clear All</button>
  </div>

  <!-- Response -->
  <div class="section">
    <div class="section-title">Response</div>
    <div class="response-box" id="response">No response yet</div>
  </div>
</div>

<script>
const LS_PREFIX = "xev_";
function save(k, v) { localStorage.setItem(LS_PREFIX + k, v); }
function load(k, def) { return localStorage.getItem(LS_PREFIX + k) ?? def; }

let questionIdCounter = parseInt(load("qcounter", "0"), 10);
let questions = JSON.parse(load("questions", "[]"));

// Init config fields
document.getElementById("cfg-url").value = load("cfg_url", "http://127.0.0.1:1234/v1");
document.getElementById("cfg-model").value = load("cfg_model", "qwen/qwen3.5-9b");
document.getElementById("cfg-key").value = load("cfg_key", "");
document.getElementById("state").value = load("state", "");

// Persist config on change
["cfg-url", "cfg-model", "cfg-key", "state"].forEach(id => {
  document.getElementById(id).addEventListener("input", e => {
    save(id.replace("cfg-", "cfg_"), e.target.value);
    updatePreview();
  });
});

// ── Connections ─────────────────────────────────────────────────────────────
const CONNECTIONS = {
  local: { url: "http://127.0.0.1:1234/v1", model: "qwen/qwen3.5-9b", note: "no API key needed" },
  openrouter: { url: "https://openrouter.ai/api/v1", model: "anthropic/claude-sonnet-4", note: "paste your OpenRouter key" },
  openai: { url: "https://api.openai.com/v1", model: "gpt-4o", note: "paste your OpenAI key" },
};

window.applyConnection = (name) => {
  const c = CONNECTIONS[name];
  if (!c) return;
  const url = document.getElementById("cfg-url");
  const model = document.getElementById("cfg-model");
  url.value = c.url;
  model.value = c.model;
  save("cfg_url", c.url);
  save("cfg_model", c.model);
  updatePreview();
  showModelsMsg(c.note);
};

function showModelsMsg(text) {
  const el = document.getElementById("models-msg");
  el.textContent = text;
  clearTimeout(showModelsMsg.timer);
  showModelsMsg.timer = setTimeout(() => { el.textContent = ""; }, 4000);
}

// Routers such as OpenRouter publish a catalog; xev serves it at /v1/models
// whenever the server is pointed at one.
window.loadModels = async () => {
  showModelsMsg("Loading...");
  try {
    const res = await fetch("/v1/models");
    const data = await res.json();
    const models = (data.models || []).map(m => m.name).filter(Boolean);
    const list = document.getElementById("model-list");
    list.innerHTML = models.map(m => `<option value="${esc(m)}"></option>`).join("");
    showModelsMsg(models.length ? `${models.length} models (start typing to pick)` : "No models returned");
  } catch (err) {
    showModelsMsg(`Failed: ${err.message}`);
  }
};

// ── Questions ──────────────────────────────────────────────────────────────
function addQuestion(type, data) {
  const id = "q" + (questionIdCounter++);
  save("qcounter", String(questionIdCounter));
  const q = data || {
    id,
    type,
    instructions: "",
    criteria: type === "choice" ? [{"key":"option1","val":""},{"key":"option2","val":""}]
             : type === "score" ? ["Level 0","Level 1","Level 2"]
             : []
  };
  if (!q.id) q.id = id;
  questions.push(q);
  saveQuestions();
  renderQuestions();
}

function removeQuestion(idx) {
  questions.splice(idx, 1);
  saveQuestions();
  renderQuestions();
}

function saveQuestions() {
  save("questions", JSON.stringify(questions));
}

function renderQuestions() {
  const el = document.getElementById("questions");
  if (questions.length === 0) {
    el.innerHTML = '<div style="color:#555;font-size:13px">No questions yet. Add one below.</div>';
    updatePreview();
    return;
  }
  el.innerHTML = questions.map((q, i) => {
    const tagClass = q.type === "choice" ? "tag-choice" : q.type === "score" ? "tag-score" : "tag-noul";
    let criteriaHtml = "";
    if (q.type === "choice") {
      const items = Array.isArray(q.criteria) ? q.criteria : [];
      criteriaHtml = `<div class="field"><label>Options</label>${
        items.map((c, ci) => `<div class="criteria-row">
          <input placeholder="key" value="${esc(c.key)}" onchange="updateCrit(${i},${ci},'key',this.value)" style="flex:0.4" />
          <input placeholder="description" value="${esc(c.val)}" onchange="updateCrit(${i},${ci},'val',this.value)" />
          <button class="remove-crit" onclick="removeCrit(${i},${ci})">&times;</button>
        </div>`).join("")
      }<button class="btn btn-sm" onclick="addCrit(${i})">+ option</button></div>`;
    } else if (q.type === "score") {
      const items = Array.isArray(q.criteria) ? q.criteria : [];
      criteriaHtml = `<div class="field"><label>Levels (ordered low to high)</label>${
        items.map((c, ci) => `<div class="criteria-row">
          <input value="${esc(c)}" onchange="updateScoreCrit(${i},${ci},this.value)" />
          <button class="remove-crit" onclick="removeScoreCrit(${i},${ci})">&times;</button>
        </div>`).join("")
      }<button class="btn btn-sm" onclick="addScoreCrit(${i})">+ level</button></div>`;
    } else if (q.type === "noul") {
      criteriaHtml = `<div style="font-size:12px;color:#555;margin-top:4px">Returns 0.0 (no) to 1.0 (yes)</div>`;
    }

    return `<div class="question-card">
      <button class="remove-btn" onclick="removeQuestion(${i})" title="Remove">&times;</button>
      <div class="question-header">
        <div class="field"><label>ID</label><input value="${esc(q.id)}" onchange="updateQ(${i},'id',this.value)" /></div>
        <div class="field"><label>Type</label>
          <select onchange="changeType(${i},this.value)">
            <option value="choice" ${q.type==="choice"?"selected":""}>choice</option>
            <option value="score" ${q.type==="score"?"selected":""}>score</option>
            <option value="noul" ${q.type==="noul"?"selected":""}>noul</option>
          </select>
        </div>
        <div style="flex:2" class="field"><label>Instructions</label><input value="${esc(q.instructions)}" onchange="updateQ(${i},'instructions',this.value)" placeholder="What should the model decide?" /></div>
      </div>
      <span class="tag ${tagClass}">${q.type}</span>
      ${criteriaHtml}
    </div>`;
  }).join("");
  updatePreview();
}

function esc(s) { return String(s||"").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }

window.updateQ = (i, k, v) => { questions[i][k] = v; saveQuestions(); updatePreview(); };
window.changeType = (i, t) => {
  questions[i].type = t;
  if (t === "choice" && !Array.isArray(questions[i].criteria)) questions[i].criteria = [{"key":"option1","val":""}];
  if (t === "score" && !Array.isArray(questions[i].criteria)) questions[i].criteria = ["Level 0","Level 1","Level 2"];
  if (t === "noul") questions[i].criteria = [];
  saveQuestions(); renderQuestions();
};

// Choice criteria
window.addCrit = (i) => { questions[i].criteria.push({"key":"","val":""}); saveQuestions(); renderQuestions(); };
window.removeCrit = (i, ci) => { questions[i].criteria.splice(ci, 1); saveQuestions(); renderQuestions(); };
window.updateCrit = (i, ci, k, v) => { questions[i].criteria[ci][k] = v; saveQuestions(); updatePreview(); };

// Score criteria
window.addScoreCrit = (i) => { questions[i].criteria.push("New level"); saveQuestions(); renderQuestions(); };
window.removeScoreCrit = (i, ci) => { questions[i].criteria.splice(ci, 1); saveQuestions(); renderQuestions(); };
window.updateScoreCrit = (i, ci, v) => { questions[i].criteria[ci] = v; saveQuestions(); updatePreview(); };

// ── Request Preview ────────────────────────────────────────────────────────
const API_PATH = "/v1/systemone";
let reqTab = "body";

function apiUrl() { return location.origin + API_PATH; }

function buildHeaders() {
  const h = { "Content-Type": "application/json" };
  const baseUrl = document.getElementById("cfg-url").value.replace(/\/+$/, "");
  const apiKey = document.getElementById("cfg-key").value || "";
  if (baseUrl) h["x-llm-base-url"] = baseUrl;
  if (apiKey) h["x-llm-api-key"] = apiKey;
  return h;
}

function buildRequest() {
  const questionsObj = {};
  questions.forEach(q => {
    const entry = { type: q.type, instructions: q.instructions };
    if (q.type === "choice") {
      entry.criteria = {};
      (Array.isArray(q.criteria) ? q.criteria : []).forEach(c => {
        // A blank row must not become an option named "" in the request.
        const key = String(c.key || "").trim();
        if (key) entry.criteria[key] = c.val || null;
      });
    } else if (q.type === "score") {
      entry.criteria = q.criteria || [];
    }
    questionsObj[q.id] = entry;
  });
  return {
    state: document.getElementById("state").value,
    model: document.getElementById("cfg-model").value,
    questions: questionsObj,
  };
}

function getCurl() {
  const body = JSON.stringify(buildRequest(), null, 2).replace(/'/g, "'\\''");
  const lines = [`curl -X POST ${apiUrl()} \\`];
  const headers = buildHeaders();
  const entries = Object.entries(headers);
  entries.forEach(([k, v], i) => {
    const suffix = i === entries.length - 1 && !body ? "" : " \\";
    lines.push(`  -H "${k}: ${v}"${suffix}`);
  });
  lines.push(`  -d '${body}'`);
  return lines.join("\n");
}

function currentRequestText() {
  if (reqTab === "curl") return getCurl();
  if (reqTab === "headers") return JSON.stringify(buildHeaders(), null, 2);
  return JSON.stringify(buildRequest(), null, 2);
}

function setReqTab(tab) {
  reqTab = tab;
  ["body", "headers", "curl"].forEach(t => {
    document.getElementById("tab-" + t).className = t === tab ? "tab active" : "tab";
  });
  document.getElementById("copy-btn").textContent =
    tab === "curl" ? "Copy cURL" : tab === "headers" ? "Copy Headers" : "Copy Body";
  updatePreview();
}

function updatePreview() {
  document.getElementById("req-url").textContent = apiUrl();
  document.getElementById("preview").textContent = currentRequestText();
}

async function copyRequest() {
  const text = currentRequestText();
  const btn = document.getElementById("copy-btn");
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
  const original = btn.textContent;
  btn.classList.add("copied");
  btn.textContent = "Copied";
  setTimeout(() => { btn.classList.remove("copied"); btn.textContent = original; }, 1200);
}

// ── Send ───────────────────────────────────────────────────────────────────
async function sendRequest() {
  const btn = document.getElementById("send-btn");
  const label = document.getElementById("send-label");
  const status = document.getElementById("status");
  const respEl = document.getElementById("response");

  btn.disabled = true;
  label.innerHTML = '<span class="spinner"></span> Evaluating...';
  status.className = "status";
  status.textContent = "Sending...";
  respEl.className = "response-box";
  respEl.textContent = "Waiting for response...";

  const reqBody = buildRequest();
  const t0 = performance.now();

  try {
    // Same endpoint third-party apps use: POST /v1/systemone
    const res = await fetch(API_PATH, {
      method: "POST",
      headers: buildHeaders(),
      body: JSON.stringify(reqBody),
    });

    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch { throw new Error(`HTTP ${res.status}: ${text.slice(0, 500)}`); }

    if (!res.ok) {
      const details = data.details ? "\n" + JSON.stringify(data.details, null, 2) : "";
      throw new Error(`HTTP ${res.status}: ${data.error || text}${details}`);
    }

    const warnings = Array.isArray(data.warnings) ? data.warnings : [];
    const payload = JSON.stringify(data, null, 2);
    respEl.className = "response-box" + (warnings.length ? " warning" : " success");
    respEl.textContent = warnings.length
      ? `WARNINGS (${warnings.length}) - the answer below may not be what the model actually said:\n`
        + warnings.map(w => "  - " + w).join("\n")
        + "\n\n"
        + payload
      : payload;
    const usage = data.usage || {};
    const tokens = `${usage.input_tokens ?? 0} in / ${usage.output_tokens ?? 0} out`;
    const elapsed = ((performance.now() - t0) / 1000).toFixed(2);
    status.className = "status" + (warnings.length ? " warn" : " ok");
    status.textContent = warnings.length
      ? `${warnings.length} warning${warnings.length > 1 ? "s" : ""} (${tokens}, ${elapsed}s)`
      : `OK (${tokens}, ${elapsed}s)`;
  } catch (err) {
    respEl.className = "response-box error";
    respEl.textContent = err.message;
    status.className = "status err";
    status.textContent = "Failed";
  } finally {
    btn.disabled = false;
    label.textContent = "Send Evaluation";
  }
}

// ── Presets ────────────────────────────────────────────────────────────────
const PRESETS = {
  support: {
    state: "Our API integration started returning 500 errors on every request about 20 minutes ago, and we can't process any customer orders until this is fixed.",
    questions: [
      { id: "department", type: "choice", instructions: "Which team should handle this?", criteria: [{"key":"billing","val":"Payment or subscription issues"},{"key":"technical","val":"Bugs or integration problems"},{"key":"sales","val":"Pricing or account questions"}] },
      { id: "frustration", type: "score", instructions: "How frustrated the customer appears", criteria: ["Calm, just stating facts","Frustrated but civil","Very angry, strong language"] },
      { id: "is_urgent", type: "noul", instructions: "The message conveys urgency or time-sensitivity", criteria: [] },
    ],
  },
  code: {
    state: "The function `calculateTotal` in `utils/math.ts` uses `var` instead of `const` and has a potential division by zero on line 42. Also the variable name `x` is not descriptive.",
    questions: [
      { id: "severity", type: "score", instructions: "How severe is this code review finding?", criteria: ["Cosmetic / style nit","Minor improvement, no risk","Potential bug, low risk","Definite bug, needs fix"] },
      { id: "action", type: "choice", instructions: "What action should be taken?", criteria: [{"key":"merge","val":"Merge as-is"},{"key":"suggest","val":"Leave suggestion, merge anyway"},{"key":"block","val":"Block until resolved"}] },
      { id: "is_security", type: "noul", instructions: "Does this finding have security implications?", criteria: [] },
    ],
  },
  email: {
    state: "Subject: Urgent - Invoice #4821 overdue\n\nHi, I noticed our payment for invoice #4821 was declined. This is the second time this month. Please update your card details or we'll need to suspend the account. Let me know if you need help.",
    questions: [
      { id: "category", type: "choice", instructions: "What type of email is this?", criteria: [{"key":"billing","val":"Payment or invoice issue"},{"key":"support","val":"Technical support request"},{"key":"sales","val":"Sales or upsell"},{"key":"spam","val":"Spam or phishing"}] },
      { id: "priority", type: "score", instructions: "How urgent is this email?", criteria: ["Low, can wait days","Medium, respond within 24h","High, respond ASAP","Critical, immediate action"] },
      { id: "is_threat", type: "noul", instructions: "Does this email contain a threat or ultimatum?", criteria: [] },
    ],
  },
};

window.loadPreset = (name) => {
  const p = PRESETS[name];
  if (p) applyPreset(p);
};

// ── Saved presets (localStorage) ────────────────────────────────────────────
let savedPresets = readSavedPresets();

function readSavedPresets() {
  try {
    const parsed = JSON.parse(load("saved_presets", "[]"));
    return Array.isArray(parsed) ? parsed.filter(p => p && p.name) : [];
  } catch {
    return [];
  }
}

function persistSavedPresets() {
  save("saved_presets", JSON.stringify(savedPresets));
}

function applyPreset(p) {
  document.getElementById("state").value = p.state || "";
  save("state", p.state || "");
  questions = JSON.parse(JSON.stringify(p.questions || []));
  bumpQuestionCounter(questions);
  saveQuestions();
  renderQuestions();
}

function bumpQuestionCounter(qs) {
  qs.forEach(q => {
    const m = /^q(\d+)$/.exec(q.id || "");
    if (m) questionIdCounter = Math.max(questionIdCounter, parseInt(m[1], 10) + 1);
  });
  save("qcounter", String(questionIdCounter));
}

function renderPresets() {
  const el = document.getElementById("saved-presets");
  if (savedPresets.length === 0) {
    el.innerHTML = '<span class="preset-label" style="color:#444">none yet</span>';
    return;
  }
  el.innerHTML = savedPresets.map(p => `<span class="preset-chip">
      <button class="btn btn-sm" onclick="loadSavedPreset('${p.id}')">${esc(p.name)}</button>
      <button class="remove-crit" title="Remove preset" onclick="removePreset('${p.id}')">&times;</button>
    </span>`).join("");
}

let presetMsgTimer = null;
function showPresetMsg(text, isError) {
  const el = document.getElementById("preset-msg");
  el.textContent = text;
  el.style.color = isError ? "#e74c3c" : "#27ae60";
  clearTimeout(presetMsgTimer);
  presetMsgTimer = setTimeout(() => { el.textContent = ""; }, 2500);
}

window.savePreset = () => {
  const input = document.getElementById("preset-name");
  const name = input.value.trim();
  if (!name) {
    showPresetMsg("Enter a name first", true);
    input.focus();
    return;
  }
  const existing = savedPresets.find(p => p.name.toLowerCase() === name.toLowerCase());
  const snapshot = JSON.parse(JSON.stringify(questions));
  if (existing) {
    existing.name = name;
    existing.state = document.getElementById("state").value;
    existing.questions = snapshot;
  } else {
    savedPresets.push({
      id: "p" + Date.now().toString(36),
      name,
      state: document.getElementById("state").value,
      questions: snapshot,
    });
  }
  persistSavedPresets();
  input.value = "";
  renderPresets();
  showPresetMsg(existing ? `Overwrote "${name}"` : `Saved "${name}"`);
};

window.loadSavedPreset = (id) => {
  const p = savedPresets.find(x => x.id === id);
  if (p) applyPreset(p);
};

window.removePreset = (id) => {
  const i = savedPresets.findIndex(p => p.id === id);
  if (i === -1) return;
  const [removed] = savedPresets.splice(i, 1);
  persistSavedPresets();
  renderPresets();
  showPresetMsg(`Removed "${removed.name}"`);
};

window.clearAll = () => {
  questions = [];
  saveQuestions();
  document.getElementById("state").value = "";
  save("state", "");
  renderQuestions();
  document.getElementById("response").textContent = "No response yet";
  document.getElementById("response").className = "response-box";
  document.getElementById("status").textContent = "";
};

// ── Init ───────────────────────────────────────────────────────────────────
renderQuestions();
renderPresets();
updatePreview();
</script>
</body>
